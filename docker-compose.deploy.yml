# One container and one image per component, built from the current code. Postgres stays outside (DATABASE_URL in
# .env.deploy). The component images start FROM hedis-base and copy from hedis-engine, so build those two first:
#   docker compose -p hedis-deploy -f docker-compose.deploy.yml --profile build build base engine
#   docker compose -p hedis-deploy -f docker-compose.deploy.yml up -d --build
#   docker compose -p hedis-deploy -f docker-compose.deploy.yml --profile setup run --rm seed   (empty schema only)
# Only the UI (8080) and the RabbitMQ management page (15673) are published, so the dev stack's ports stay free.
# Profile "observability" adds Grafana (127.0.0.1:3001) and Prometheus (127.0.0.1:9091).
name: hedis-deploy

x-python: &python
  init: true
  restart: unless-stopped
  env_file:
    - .env
    - .env.deploy
  environment:
    RABBITMQ_HOST: rabbitmq
    INTEGRATION_WORK_DIR: /data/work
    EVIDENCE_STORAGE_DIR: /data/generated_evidence
    INTAKE_STORE_DIR: /data/intake_store
  depends_on:
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks:
    - hedis

services:
  # Build-only: profile "build" never starts them; their images are the base of the component images.
  base:
    image: hedis-base:latest
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    profiles: ["build"]

  engine:
    image: hedis-engine:latest
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    profiles: ["build"]

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    restart: unless-stopped
    env_file:
      - .env.deploy
    # Map the app's RABBITMQ_USER/RABBITMQ_PASSWORD to the broker's default user (guest only works on localhost).
    # The cookie is made up front: a healthcheck that runs first would create it as root and lock the broker out.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export RABBITMQ_DEFAULT_USER="$$RABBITMQ_USER" RABBITMQ_DEFAULT_PASS="$$RABBITMQ_PASSWORD";
        cookie=/var/lib/rabbitmq/.erlang.cookie;
        [ -s "$$cookie" ] || { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$cookie"; chmod 400 "$$cookie"; };
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ping passes before the AMQP listener is up; this waits until it accepts connections.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - hedis

  # migrate builds hedis-deploy-tools; seed reuses it (parallel builds of one tag collide).
  migrate:
    <<: *python
    image: hedis-deploy-tools:latest
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    restart: "no"
    command: ["sh", "-c", "python scripts/db/ensure_schema.py && python -m alembic -c db/alembic.ini upgrade head"]
    depends_on: {}

  seed:
    <<: *python
    image: hedis-deploy-tools:latest
    pull_policy: never
    restart: "no"
    profiles: ["setup"]
    command: ["python", "scripts/db/load_seed.py", "--reference-only"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *python
    image: hedis-deploy-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    volumes:
      - hedis-data:/data
      # logs/hedis-app.log (common/app_logging.py), tailed by alloy under profile observability.
      - hedis-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  outbox:
    <<: *python
    image: hedis-deploy-outbox:latest
    build:
      context: .
      dockerfile: docker/outbox.Dockerfile

  ingestion:
    <<: *python
    image: hedis-deploy-ingestion:latest
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    volumes:
      - hedis-data:/data

  quality:
    <<: *python
    image: hedis-deploy-quality:latest
    build:
      context: .
      dockerfile: docker/quality.Dockerfile

  measures:
    <<: *python
    image: hedis-deploy-measures:latest
    build:
      context: .
      dockerfile: docker/measures.Dockerfile

  gap-identifier:
    <<: *python
    image: hedis-deploy-gap-identifier:latest
    build:
      context: .
      dockerfile: docker/gap-identifier.Dockerfile

  prioritization:
    <<: *python
    image: hedis-deploy-prioritization:latest
    build:
      context: .
      dockerfile: docker/prioritization.Dockerfile

  ai-evidence:
    <<: *python
    image: hedis-deploy-ai-evidence:latest
    build:
      context: .
      dockerfile: docker/ai-evidence.Dockerfile
    volumes:
      - hedis-data:/data

  stars:
    <<: *python
    image: hedis-deploy-stars:latest
    build:
      context: .
      dockerfile: docker/stars.Dockerfile

  ui:
    image: hedis-deploy-ui:latest
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hedis

  # Monitoring, profile "observability" (run_containers.ps1 -Observability). Same configs as observability/, other
  # ports and default container names, so the local run's hedis-prometheus, hedis-grafana and the rest stay apart.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./observability/prometheus.deploy.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - hedis

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    # GRAFANA_ADMIN_PASSWORD and GRAFANA_DB_PASSWORD come from the env files, so .env.deploy can override .env.
    env_file:
      - .env
      - .env.deploy
    entrypoint:
      - /bin/sh
      - -c
      - export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_ADMIN_PASSWORD:-admin}"; exec /run.sh
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hedis-overview.json
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - hedis

  loki:
    image: grafana/loki:3.5.0
    profiles: ["observability"]
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - hedis

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - hedis-logs:/var/log/hedis:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    networks:
      - hedis

volumes:
  hedis-data:
  rabbitmq-data:
  hedis-logs:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  hedis:
