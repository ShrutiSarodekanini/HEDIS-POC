# Monitoring for the container deployment: Prometheus, Grafana, Loki and Alloy, each built from its Dockerfile in
# docker/ with its config from observability/ copied in (rebuild after changing a config or dashboard). Every Python
# service gets ALLOY_URL and pushes its log records to Alloy, which masks them and sends them to Loki.
# Always used after docker-compose.deploy.yml, which must come first: Compose resolves every relative path from the
# first file's folder (the repo root), and the network hedis is declared there.
#   docker compose -p hedis-deploy -f docker-compose.deploy.yml -f docker/docker-compose.observability.yml up -d
# scripts/run_containers.ps1 passes both files unless -NoObservability is given. Only Grafana (127.0.0.1:3001) and
# Prometheus (127.0.0.1:9091) are published; containers keep compose's default names, apart from the local run's
# hedis-grafana.
x-ship-logs: &ship-logs
  environment:
    ALLOY_URL: http://alloy:3500

services:
  # Merged into the app services of docker-compose.deploy.yml (not migrate or seed): only ALLOY_URL is added.
  api: *ship-logs
  outbox: *ship-logs
  ingestion: *ship-logs
  quality: *ship-logs
  measures: *ship-logs
  gap-identifier: *ship-logs
  prioritization: *ship-logs
  ai-evidence: *ship-logs
  stars: *ship-logs

  prometheus:
    image: hedis-deploy-prometheus:latest
    build:
      context: .
      dockerfile: docker/prometheus.Dockerfile
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - hedis

  grafana:
    image: hedis-deploy-grafana:latest
    build:
      context: .
      dockerfile: docker/grafana.Dockerfile
    # GRAFANA_ADMIN_PASSWORD, GRAFANA_DB_PASSWORD and GRAFANA_ANONYMOUS come from the env files; .env.deploy wins.
    env_file:
      - .env
      - .env.deploy
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    volumes:
      # Grafana's state (GF_PATHS_DATA in the image); a volume on /var/lib/grafana would hide the dashboards.
      - grafana-data:/var/lib/grafana/state
    restart: unless-stopped
    networks:
      - hedis

  loki:
    image: hedis-deploy-loki:latest
    build:
      context: .
      dockerfile: docker/loki.Dockerfile
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - hedis

  # Port 3500 (log push) and 12345 (Alloy UI) are reachable on the network only.
  alloy:
    image: hedis-deploy-alloy:latest
    build:
      context: .
      dockerfile: docker/alloy.Dockerfile
    depends_on:
      - loki
    volumes:
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    networks:
      - hedis

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
