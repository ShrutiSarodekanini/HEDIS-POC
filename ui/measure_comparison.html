<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEDIS Measure Comparison POC</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #172033; background: #f4f7fb; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    .card { background: white; border: 1px solid #d9e1ee; border-radius: 10px; padding: 20px; margin-top: 18px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; }
    select, button { font: inherit; padding: 9px 12px; border-radius: 6px; border: 1px solid #b8c5d8; }
    button { background: #1455a3; color: white; border: 0; cursor: pointer; margin-top: 16px; }
    button:disabled { opacity: .6; cursor: wait; }
    .gaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 8px; }
    .gap { border: 1px solid #e1e7f0; padding: 9px; border-radius: 6px; }
    .comparison { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .metric { display: flex; justify-content: space-between; border-bottom: 1px solid #edf0f5; padding: 8px 0; }
    .notice { background: #fff8dd; padding: 12px; border-radius: 6px; margin-top: 12px; }
    .error { color: #a21b1b; }
    @media (max-width: 700px) { .comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>HEDIS Measure Performance Comparison</h1>
  <p>Mock POC performance scenario with official CMS measure-level Star methodology.</p>
  <div class="card">
    <label for="measure">Mock HEDIS measure</label>
    <select id="measure"></select>
    <div id="gaps" class="gaps"></div>
    <button id="compare">Calculate comparison</button>
    <div id="message" role="status"></div>
  </div>
  <div id="result" class="card" hidden></div>
</main>
<script>
  const measureSelect = document.getElementById("measure");
  const gaps = document.getElementById("gaps");
  const result = document.getElementById("result");
  const message = document.getElementById("message");

  async function loadMeasures() {
    const response = await fetch("/api/measure-performance/measures");
    const measures = await response.json();
    measureSelect.innerHTML = measures.map(m => `<option value="${m.code}">${m.code} - ${m.name}</option>`).join("");
    await loadGaps();
  }

  async function loadGaps() {
    const response = await fetch(`/api/measure-performance/${measureSelect.value}/gaps`);
    const gapList = await response.json();
    gaps.innerHTML = gapList.map(g => `
      <label class="gap"><input type="checkbox" value="${g.gap_id}">
        ${g.gap_id} (${g.evidence_status})</label>`).join("");
  }

  function metric(label, before, after) {
    return `<div class="metric"><span>${label}</span><strong>${before ?? "N/A"} → ${after ?? "N/A"}</strong></div>`;
  }

  async function compare() {
    const button = document.getElementById("compare");
    button.disabled = true;
    message.textContent = "Calculating mock comparison...";
    const selected_gap_ids = [...gaps.querySelectorAll("input:checked")].map(input => input.value);
    const response = await fetch("/api/measure-performance/compare", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({measure_code: measureSelect.value, selected_gap_ids})
    });
    const data = await response.json();
    button.disabled = false;
    if (!response.ok) { message.innerHTML = `<p class="error">${data.detail}</p>`; return; }
    message.textContent = "";
    const pct = value => value == null ? "N/A" : `${value.toFixed(2)}%`;
    result.hidden = false;
    result.innerHTML = `<h2>${data.measure.code} - ${data.measure.name}</h2>
      <p><strong>Performance inputs:</strong> ${data.disclaimer}</p>
      <p><strong>CMS rating year:</strong> ${data.measure.cms_rating_year}
        | <strong>Measurement year:</strong> ${data.measure.measurement_year}
        | <strong>Official mapping:</strong> ${data.measure.star_rating_verified ? "Verified" : "Unavailable"}</p>
      <div class="comparison">
        <section><h3>Baseline</h3>${metric("Numerator", data.baseline.numerator, data.baseline.numerator)}
          ${metric("Denominator", data.baseline.denominator, data.baseline.denominator)}
          ${metric("Performance rate", pct(data.baseline.performance_rate), pct(data.baseline.performance_rate))}
          ${metric("Open care gaps", data.baseline.open_care_gaps, data.baseline.open_care_gaps)}
          ${metric("CMS Star rating", data.baseline.sample_star_rating, data.baseline.sample_star_rating)}</section>
        <section><h3>After selected closures</h3>${metric("Numerator", data.baseline.numerator, data.recalculated.numerator)}
          ${metric("Denominator", data.baseline.denominator, data.recalculated.denominator)}
          ${metric("Performance rate", pct(data.baseline.performance_rate), pct(data.recalculated.performance_rate))}
          ${metric("Open care gaps", data.baseline.open_care_gaps, data.recalculated.open_care_gaps)}
          ${metric("CMS Star rating", data.baseline.sample_star_rating, data.recalculated.sample_star_rating)}</section>
      </div>
      <p><strong>Rate change:</strong> ${data.changes.performance_rate_change_percentage_points == null ? "N/A" : data.changes.performance_rate_change_percentage_points.toFixed(2) + " percentage points"}
        | <strong>Relative improvement:</strong> ${data.changes.relative_improvement_percent == null ? "N/A" : data.changes.relative_improvement_percent.toFixed(2) + "%"}
        | <strong>Gaps closed:</strong> ${data.changes.gaps_closed}</p>
      <p><strong>Rating methodology:</strong> ${data.measure.rating_methodology}</p>
      <p><a href="${data.measure.cms_technical_notes_url}" target="_blank" rel="noopener">CMS 2027 Technical Notes</a>
        | <a href="${data.measure.cms_measure_set_url}" target="_blank" rel="noopener">CMS 2027 Star Ratings Measures</a></p>
      ${data.warnings.length ? `<div class="notice"><strong>Validation warnings</strong><ul>${data.warnings.map(w => `<li>${w}</li>`).join("")}</ul></div>` : ""}
      <small>Calculation status: ${data.calculation_status}; last calculated: ${data.last_calculated_at}</small>`;
  }
  measureSelect.addEventListener("change", loadGaps);
  document.getElementById("compare").addEventListener("click", compare);
  loadMeasures().catch(error => { message.innerHTML = `<p class="error">${error}</p>`; });
</script>
</body>
</html>
