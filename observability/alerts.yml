groups:
  - name: hedis
    rules:
      - alert: HedisBatchFailed
        expr: increase(hedis_batches_total{status="failed"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A batch failed in the last 15 minutes; see hedis_batch_failures_total for the step.

      - alert: HedisAiErrorRateHigh
        expr: sum(rate(hedis_ai_calls_total{outcome!="ok"}[15m])) / sum(rate(hedis_ai_calls_total[15m])) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 10% of model calls failed, came back empty or were cut off over 15 minutes.

      - alert: HedisEngineRetried
        expr: increase(hedis_engine_retries_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: The measure engine crashed and was retried in the last 30 minutes.

      - alert: HedisAppDown
        expr: up{job="hedis-integration"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The HEDIS integration app is not answering /metrics
          description: Prometheus could not scrape the app for over a minute. Check that it is running.

      - alert: HedisUiBackendDown
        expr: up{job="hedis-ui-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The new UI's backend (app.py) is not answering /metrics
          description: Prometheus could not scrape app.py for over a minute. Check that uvicorn app:app is running.

      - alert: HedisUiServerErrors
        expr: sum(rate(http_requests_total{job="hedis-ui-backend", status="5xx"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The new UI's backend has returned 5xx errors for 5 minutes; see the HEDIS new UI dashboard.
