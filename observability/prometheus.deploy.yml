# For the container deployment (docker-compose.deploy.yml, profile observability); the local run uses the template.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: hedis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # For later: RabbitMQ with the rabbitmq_prometheus plugin enabled.
  # - job_name: rabbitmq
  #   static_configs:
  #     - targets: ["rabbitmq:15692"]
